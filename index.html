<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Forever Guides</title>
<style>
:root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #1e2428; --muted: #5d666c; --line: #d8d1c2; --link: #0b6a78; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe7; --muted: #a8a69f; --line: #393833; --link: #6fd0dd; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(30px, 6vw, 44px); line-height: 1.2; margin: 0; }
p { color: var(--muted); margin: 8px 0 24px; }
a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 10px; color: var(--link); font-weight: 600; font-size: 18px; text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--link); }
a.card span { display: block; color: var(--muted); font-size: 15px; font-weight: 400; }
</style>
</head>
<body>
<div class="wrap">
  <h1>WoW Forever Guides</h1>

</div>
</body>
</html>
